<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Maison Matcha Order</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="ສັ່ງເຄື່ອງດື່ມ Maison Matcha ແລະ ສົ່ງອໍເດີຜ່ານ WhatsApp">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&family=Solway:wght@300;400;500;700&display=swap">
<style>
/* Layout: single column on phones, gallery + sticky cart from 1000px. One deliberate light look (the shop's cream paper and matcha ink). */
:root {
  --bg: #f5f4ef; --paper: #eeeae1; --card: #fbfaf6; --ink: #243229; --muted: #576452; --soft: #8a9384;
  --line: #c8cdbd; --line-soft: #dfe1d6; --green: #3a6b24; --green-tint: #e4ead9; --gold: #a8874a;
  --gold-tint: #f3ead6; --red: #9b3b2e; --red-tint: #f6e3df; --white: #ffffff; --receipt-ink: #222222; --receipt-soft: #6b6b6b;
  --font: 'Solway', 'Noto Sans Lao', Georgia, serif;
  --font-lao: 'Noto Sans Lao', 'Solway', system-ui, sans-serif;
  --r: 14px;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-weight: 500; line-height: 1.3; margin: 0; text-wrap: balance; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); } .small { font-size: .875rem; } .tiny { font-size: .78rem; }
.num { font-variant-numeric: tabular-nums; }
.en { font-family: 'Solway', Georgia, serif; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

.brand { text-align: center; padding-block: 20px 4px; }
.brand img { height: 60px; width: auto; margin: 0 auto; }
.brand .tag { letter-spacing: .2em; font-size: .66rem; color: var(--muted); margin-top: 6px; }
.toolbar { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 10px 0 0; }
.intro { text-align: center; max-width: 34rem; margin: 10px auto 0; }
.intro h1 { font-size: 1.45rem; font-family: var(--font-lao); }
.intro p { margin: 6px 0 0; color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
  padding: 11px 18px; border-radius: 999px; cursor: pointer; text-decoration: none; font-weight: 500; min-height: 46px; white-space: nowrap; font-family: var(--font-lao); }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.green { background: var(--green); border-color: var(--green); color: var(--white); }
.btn.small { min-height: 36px; padding: 6px 13px; font-size: .88rem; }
.btn.block { width: 100%; }
.link { background: none; border: 0; padding: 0; color: var(--green); text-decoration: underline; cursor: pointer; font-family: var(--font-lao); }
.link.red { color: var(--red); }

.cats { display: flex; gap: 8px; overflow-x: auto; padding-block: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cats a { flex: none; text-decoration: none; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); background: var(--card); font-family: var(--font-lao); font-size: .93rem; }
.cats a.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

.layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); padding-bottom: 110px; }
@media (min-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr) 380px; padding-bottom: 40px; } .layout aside { position: sticky; top: 16px; align-self: start; max-height: calc(100vh - 32px); overflow: auto; } }
.cat-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 18px 0 10px; }
.cat-head h2 { font-size: 1.2rem; font-family: var(--font-lao); }
.gallery { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 720px) { .gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card { background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card .ph { position: relative; display: block; width: 100%; aspect-ratio: 1 / 1; max-width: 100%; background: var(--paper); padding: 0; border: 0; cursor: pointer; overflow: hidden; }
.card .ph img { position: absolute; inset: 8%; width: 84%; height: 84%; object-fit: contain; object-position: center; }
.card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.card .code { font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.card .nm { font-family: var(--font-lao); font-weight: 600; line-height: 1.35; }
.card .sub { font-size: .8rem; color: var(--muted); }
.card .pr { margin-top: auto; padding-top: 6px; font-weight: 500; font-size: .95rem; }
.card .btn { margin-top: 8px; }
.incart { font-size: .75rem; color: var(--green); font-family: var(--font-lao); }

.panel { background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 18px; }
.panel + .panel { margin-top: 14px; }
.panel h2 { font-size: 1.1rem; margin-bottom: 12px; font-family: var(--font-lao); }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding-block: 10px; border-bottom: 1px solid var(--line-soft); }
.line:last-child { border-bottom: 0; }
.line .t { font-weight: 600; font-family: var(--font-lao); }
.line .o { font-size: .84rem; color: var(--muted); font-family: var(--font-lao); overflow-wrap: anywhere; }
.line .ctrl { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin-top: 4px; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--white); }
.qty button { width: 38px; height: 38px; border: 0; background: none; cursor: pointer; font-size: 1.1rem; }
.qty span { min-width: 28px; text-align: center; }
.sum { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-block: 4px; }
.sum.big { font-size: 1.2rem; font-weight: 600; }
.empty { text-align: center; color: var(--muted); padding: 22px 8px; font-family: var(--font-lao); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--ink); color: var(--paper); display: flex; align-items: center; gap: 12px;
  padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar .btn { background: var(--paper); color: var(--ink); border-color: var(--paper); }
@media (min-width: 1000px) { .bar { display: none !important; } }

label.f { display: block; margin-bottom: 14px; }
label.f > span, .flabel { display: block; font-size: .88rem; color: var(--muted); margin-bottom: 6px; font-family: var(--font-lao); }
.req { color: var(--red); }
input[type=text], input[type=tel], input[type=datetime-local], input[type=number], select, textarea {
  width: 100%; background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; min-height: 46px; outline: none; }
textarea { min-height: 84px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-tint); }
.bad { border-color: var(--red) !important; }
.err { color: var(--red); font-size: .84rem; margin-top: 4px; font-family: var(--font-lao); }
.phone { display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; }
.seg span { display: inline-flex; align-items: center; padding: 9px 14px; min-height: 42px; border-radius: 999px; border: 1px solid var(--line); background: var(--white); cursor: pointer; font-family: var(--font-lao); font-size: .94rem; }
.seg input:checked + span { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.seg input:focus-visible + span { outline: 2px solid var(--green); outline-offset: 2px; }
.seg input:disabled + span { opacity: .4; cursor: not-allowed; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-family: var(--font-lao); }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--green); flex: none; }
.note { padding: 12px 14px; border-radius: 12px; font-size: .92rem; font-family: var(--font-lao); }
.note.info { background: var(--green-tint); color: var(--ink); }
.note.warn { background: var(--gold-tint); color: var(--ink); }
.note.bad { background: var(--red-tint); color: var(--red); }

.view[hidden] { display: none !important; }
.narrow { max-width: 640px; margin: 0 auto; padding-block: 8px 48px; }
.back { margin: 6px 0 10px; }
.actions { display: grid; gap: 10px; margin-top: 14px; }
.actions .row { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .row > .btn { flex: 1 1 auto; }
.copybox { width: 100%; min-height: 220px; font-size: .84rem; font-family: var(--font-lao); white-space: pre-wrap; }

dialog { border: 0; padding: 0; border-radius: 18px; width: min(560px, calc(100vw - 20px)); max-height: calc(100dvh - 20px); background: var(--card); color: var(--ink); }
dialog::backdrop { background: rgba(36, 50, 41, .45); }
.dh { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
.dh img { width: 64px; height: 64px; object-fit: contain; background: var(--paper); border-radius: 12px; padding: 4px; flex: none; }
.dh h3 { font-family: var(--font-lao); font-size: 1.05rem; }
.dh .x { margin-left: auto; width: 40px; height: 40px; border: 0; background: none; font-size: 1.6rem; cursor: pointer; flex: none; }
.db { padding: 14px 16px; overflow: auto; max-height: calc(100dvh - 210px); }
.df { padding: 12px 16px; border-top: 1px solid var(--line-soft); display: flex; gap: 10px; align-items: center; }
.grp { margin-bottom: 16px; }

.toast-host { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 20; width: min(440px, calc(100vw - 32px)); display: grid; gap: 8px; }
.toast { background: var(--ink); color: var(--paper); padding: 11px 15px; border-radius: 12px; font-family: var(--font-lao); font-size: .93rem; }
.toast.e { background: var(--red); color: var(--white); }
.toast.o { background: var(--green); color: var(--white); }

/* Receipt — follows the Maison Matcha POS receipt */
.receipt { background: var(--white); color: var(--receipt-ink); max-width: 380px; margin: 0 auto; padding: 26px 22px 18px; border-radius: 6px; border: 1px solid var(--line-soft); overflow: hidden; }
.receipt .lg { width: 140px; margin: 0 auto 12px; }
.receipt .shop { text-align: center; font-weight: 700; }
.receipt .shop2 { text-align: center; font-size: .9rem; letter-spacing: .04em; }
.receipt .kind { margin: 12px auto 0; width: max-content; max-width: 100%; border: 1.5px solid var(--receipt-ink); padding: 4px 12px; border-radius: 4px; font-family: var(--font-lao); font-weight: 600; font-size: .86rem; text-align: center; }
.receipt hr { border: 0; border-top: 1px dashed #cccccc; margin: 14px 0; }
.receipt .tot { text-align: center; font-size: 2.2rem; line-height: 1.1; }
.receipt .totl { text-align: center; color: var(--receipt-soft); font-size: .88rem; margin-top: 4px; font-family: var(--font-lao); }
.receipt .meta { font-size: .92rem; line-height: 1.65; overflow-wrap: anywhere; }
.receipt .it { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; padding: 3px 0 9px; }
.receipt .it .n { font-family: var(--font-lao); }
.receipt .it .d { grid-column: 1 / -1; color: var(--receipt-soft); font-size: .86rem; font-family: var(--font-lao); overflow-wrap: anywhere; }
.receipt .s { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; font-family: var(--font-lao); }
.receipt .s.b { font-weight: 700; }
.receipt .confirm { font-size: .84rem; color: var(--receipt-soft); font-family: var(--font-lao); text-align: center; }
.receipt .foot { text-align: center; color: var(--receipt-soft); }
.receipt .bottom { display: flex; justify-content: space-between; gap: 10px; color: var(--receipt-soft); font-size: .88rem; margin-top: 10px; }

@media print {
  body { background: var(--white); }
  body > *:not(#print-area) { display: none !important; }
  #print-area { display: block !important; }
  #print-area .receipt { border: 0; max-width: 80mm; padding: 4mm; }
}
#print-area { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card); margin-top: 12px; }
.lang button { border: 0; background: none; padding: 7px 16px; cursor: pointer; font-size: .9rem; min-height: 38px; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.card .desc { font-size: .82rem; color: var(--muted); line-height: 1.45; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.mopt { font-size: .78rem; color: var(--soft); }
html[lang="en"] .intro h1, html[lang="en"] .card .nm, html[lang="en"] .panel h2, html[lang="en"] .cat-head h2, html[lang="en"] .dh h3 { font-family: var(--font); }
</style>

<main>
  <section class="view wrap" id="v-menu">
    <div class="intro">
      <h1 data-t="title"></h1>
      <p data-t="subtitle"></p>
      <p class="small" data-t="unit" style="margin-top:4px"></p>
    </div>
    <div class="layout" style="margin-top:6px">
      <div id="gallery"></div>
      <aside class="panel" id="cart-panel">
        <h2 data-t="cart"></h2>
        <div id="cart"></div>
        <div class="sum big" style="border-top:1px dashed var(--line);margin-top:6px;padding-top:12px"><span data-t="total"></span><span class="num" id="cart-total"></span></div>
        <div class="actions">
          <button class="btn block" id="go-details" type="button" data-t="toDetails"></button>
          <button class="btn ghost block small" id="new-order-1" type="button" data-t="newOrder"></button>
        </div>
      </aside>
    </div>
  </section>

  <section class="view wrap" id="v-details" hidden>
    <div class="narrow">
      <button class="link back" type="button" data-go="menu" data-t="backMenu"></button>
      <form class="panel" id="details" novalidate>
        <h2 data-t="customer"></h2>
        <label class="f"><span><span data-t="name"></span> <b class="req">*</b></span><input type="text" id="c-name" autocomplete="name" maxlength="80"></label>
        <div class="f" style="margin-bottom:14px"><label class="flabel" for="c-phone"><span data-t="phone"></span> <b class="req">*</b></label>
          <div class="phone">
            <select id="c-cc" aria-label="Country code">
              <option value="+856">LA +856</option><option value="+66">TH +66</option><option value="+84">VN +84</option><option value="+86">CN +86</option>
              <option value="+855">KH +855</option><option value="+81">JP +81</option><option value="+82">KR +82</option><option value="+65">SG +65</option>
              <option value="+1">US +1</option><option value="+44">UK +44</option><option value="+33">FR +33</option><option value="+61">AU +61</option><option value="+49">DE +49</option>
              <option value="other" data-t="otherCode"></option>
            </select>
            <input type="tel" id="c-phone" inputmode="tel" autocomplete="tel-national" placeholder="20 5555 1234">
          </div></div>
        <label class="f"><span data-t="company"></span><input type="text" id="c-company" autocomplete="organization" maxlength="120"></label>

        <h2 style="margin-top:8px" data-t="fulfil"></h2>
        <div class="grp"><span class="flabel"><span data-t="orderType"></span> <b class="req">*</b></span>
          <div class="seg" id="c-type">
            <label><input type="radio" name="type" value="pickup" id="t-pickup" checked><span data-t="pickup"></span></label>
            <label><input type="radio" name="type" value="dine_in" id="t-dine"><span data-t="dine_in"></span></label>
            <label id="delivery-opt"><input type="radio" name="type" value="delivery" id="t-delivery"><span data-t="delivery"></span></label>
          </div></div>
        <label class="f"><span><span id="when-label"></span> <b class="req">*</b></span><input type="datetime-local" id="c-when"></label>
        <label class="f" id="addr-wrap" hidden><span><span data-t="address"></span> <b class="req">*</b></span><textarea id="c-addr" maxlength="400"></textarea></label>
        <div class="note warn" id="fee-note" hidden style="margin:-4px 0 14px" data-t="feeNote"></div>
        <label class="f" id="staff-wrap" hidden><span><span data-t="staff"></span> <b class="req">*</b></span><select id="c-staff"></select></label>
        <label class="f" id="table-wrap" hidden><span data-t="table"></span><input type="text" id="c-table" maxlength="20"></label>
        <label class="f"><span data-t="notes"></span><textarea id="c-notes" maxlength="600"></textarea></label>
        <button class="btn block" type="submit" data-t="preview"></button>
      </form>
    </div>
  </section>

  <section class="view wrap" id="v-preview" hidden>
    <div class="narrow">
      <button class="link back" type="button" data-go="details" data-t="backEdit"></button>
      <div id="receipt"></div>
      <div class="actions">
        <a class="btn green block" id="wa" href="#" target="_blank" rel="noopener" data-t="sendWa"></a>
        <div class="note info" id="wa-note"></div>
        <div class="row">
          <button class="btn ghost" id="copy" type="button" data-t="copy"></button>
          <button class="btn ghost" id="print" type="button" hidden data-t="print"></button>
          <button class="btn ghost" type="button" data-go="details" data-t="edit"></button>
        </div>
        <textarea class="copybox" id="copy-text" readonly hidden></textarea>
        <button class="btn ghost block" id="new-order-2" type="button" data-t="newOrder"></button>
      </div>
    </div>
  </section>
</main>

<div class="bar" id="bar" hidden>

/* ───────── Pricing ───────── */
function nuttyPrice(p) {

}
function basePrice(l) {

  if (p.ways) { const w = p.ways.find((x) => x.key === l.way); return w ? w.price : 0; }
  if (l.matcha === 'no3') return nuttyPrice(p) || p.price;
  return p.price;
}
const unitPrice = (l) => basePrice(l) + (l.oat ? OAT_PRICE : 0);
const lineTotal = (l) => unitPrice(l) * l.qty;

function optText(l, lang = LANG) {
  const p = BY_ID.get(l.pid); const out = [];
  const w = p && p.ways ? p.ways.find((x) => x.key === l.way) : null;
  if (w) out.push(nm(w, lang));
  if (p && p.matcha && l.matcha && l.matcha !== 'house') { const m = MATCHAS.find((x) => x.key === l.matcha); out.push(`${m.code} ${nm(m, lang)}`); }
  if (l.oat) out.push(`${T[lang].oatShort} +${n(OAT_PRICE)}`);
  if (l.sweet !== null && l.sweet !== undefined) out.push(T[lang].sweetShort(l.sweet));
  return out.join(' · ');
}

  if (!p.ways) return kip(p.price);

function typeChanged() {
  const ty = ($('input[name=type]:checked') || {}).value;
  $('#addr-wrap').hidden = ty !== 'delivery'; $('#fee-note').hidden = ty !== 'delivery'; $('#table-wrap').hidden = ty !== 'dine_in'; $('#staff-wrap').hidden = ty !== 'dine_in';
  $('#when-label').textContent = t(ty === 'delivery' ? 'whenDelivery' : ty === 'dine_in' ? 'whenDine' : 'whenPickup');
}
function fieldErr(input, msg) {
  input.classList.add('bad');
  const e = document.createElement('div'); e.className = 'err'; e.textContent = msg; (input.closest('label.f, .f, .grp') || input.parentElement).append(e);
}
function validate() {
  $$('#details .err').forEach((e) => e.remove()); $$('#details .bad').forEach((e) => e.classList.remove('bad'));
  const d = D(); let ok = true;
  if (!d.name) { fieldErr($('#c-name'), t('errName')); ok = false; }
  if (!/^\+[1-9]\d{7,14}$/.test(phoneFull(d))) { fieldErr($('#c-phone'), t('errPhone')); ok = false; }
  if (!d.type) { fieldErr($('#c-type'), t('errType')); ok = false; }
  if (!d.when) { fieldErr($('#c-when'), t('errWhen')); ok = false; }
  else if (fromLaoInput(d.when).getTime() < Date.now() - 10 * 60e3) { fieldErr($('#c-when'), t('errPast')); ok = false; }
  if (d.type === 'delivery' && !d.addr) { fieldErr($('#c-addr'), t('errAddr')); ok = false; }
  if (d.type === 'dine_in' && !STAFF.includes(d.staff)) { fieldErr($('#c-staff'), t('errStaff')); ok = false; }
  if (!ok) { toast(t('errCheck'), 'e'); const f = $('#details .bad'); if (f) f.scrollIntoView({ block: 'center' }); }
  return ok ? d : null;
}

/* ───────── Order reference ───────── */
function ensureRef() {
  if (state.ref) return;
  const x = laoParts(new Date());
  const abc = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const rnd = [...crypto.getRandomValues(new Uint8Array(4))].map((b) => abc[b % abc.length]).join('');
  state.ref = `MM-${String(x.y).slice(2)}${x.m}${x.d}-${rnd}`;
  state.created = new Date().toISOString();
  save();
}

/* ───────── Receipt (viewer's language) + WhatsApp text (always Lao for the shop) ───────── */
const whenKey = (ty) => (ty === 'delivery' ? 'rWhenDelivery' : ty === 'dine_in' ? 'rWhenDine' : 'rWhenPickup');
function receiptHtml(d) {
  const total = cartTotal();
  return `<div class="receipt" lang="${LANG}">
    <img class="lg" src="${LOGO}" alt="Maison Matcha">
    <div class="shop en">Maison Matcha</div><div class="shop2 en">MAISON MATCHA</div>
    <div class="kind">${t('rKind')}</div>
    <hr>
    <div class="tot num">₭${n(total)}</div>
    <div class="totl">${d.type === 'delivery' ? t('rTotalNoFee') : t('rTotal')}</div>
    <hr>
    <div class="meta">
      <div>${t('rCustomer')}: ${esc(d.name)}</div>
      <div>WhatsApp: <span class="num">${esc(phoneFull(d))}</span></div>
      ${d.company ? `<div>${t('rCompany')}: ${esc(d.company)}</div>` : ''}
      <div>${t('rType')}: ${t(d.type)}</div>
      <div>${t(whenKey(d.type))}: <span class="num">${laoDT(fromLaoInput(d.when))}</span></div>
      ${d.type === 'delivery' ? `<div>${t('rAddr')}: ${esc(d.addr)}</div>` : ''}
      ${d.type === 'dine_in' && d.table ? `<div>${t('rTable')}: ${esc(d.table)}</div>` : ''}
      ${d.type === 'dine_in' && d.staff ? `<div>${t('rStaff')}: ${esc(d.staff)}</div>` : ''}
    </div>
    <hr>
    ${state.cart.map((l) => { const p = BY_ID.get(l.pid); return `<div class="it"><span class="n">${esc(nm(p))}</span><span class="num">₭${n(lineTotal(l))}</span>
      <span class="d num">${t('cups', l.qty)} × ₭${n(unitPrice(l))}</span>${optText(l) ? `<span class="d">${esc(optText(l))}</span>` : ''}${l.note ? `<span class="d">${t('noteLabel')}: ${esc(l.note)}</span>` : ''}</div>`; }).join('')}
    <hr>
    <div class="s b"><span>${t('rTotal')}</span><span class="num">₭${n(total)}</span></div>
    ${d.type === 'delivery' ? `<div class="s"><span>${t('rFee')}</span><span>${t('rFeeVal')}</span></div>` : ''}
    ${d.notes ? `<hr><div class="meta small">${t('noteLabel')}: ${esc(d.notes)}</div>` : ''}
    <hr>
    <div class="confirm">${t('rConfirm')}</div>
    <hr>
    <div class="foot en">Nice to Matcha</div>
    <div class="bottom num"><span>${laoDT(state.created)}</span><span>№ ${esc(state.ref)}</span></div>
  </div>`;
}
function messageText(d) {
  const L = [];
  L.push('ອໍເດີໃໝ່ · Maison Matcha');
  L.push(`ເລກອ້າງອີງ: ${state.ref}`);
  L.push(`ວັນທີສັ່ງ: ${laoDT(state.created)} (ເວລາລາວ)`);
  L.push('');
  L.push(`ລູກຄ້າ: ${d.name}`);
  L.push(`WhatsApp: ${phoneFull(d)}`);
  if (d.company) L.push(`ຮ້ານ/ບໍລິສັດ: ${d.company}`);
  L.push(`ປະເພດ: ${tl(d.type)}`);
  L.push(`${tl(whenKey(d.type))}: ${laoDT(fromLaoInput(d.when))}`);
  if (d.type === 'delivery') L.push(`ທີ່ຢູ່ຈັດສົ່ງ: ${d.addr}`);
  if (d.type === 'dine_in' && d.table) L.push(`ໂຕະ: ${d.table}`);
  if (d.type === 'dine_in' && d.staff) L.push(`ພະນັກງານ: ${d.staff}`);
  L.push('');
  L.push('ລາຍການ:');
  state.cart.forEach((l, i) => {
    const p = BY_ID.get(l.pid);
    L.push(`${i + 1}. ${p.lo} (${p.en})`);
    const o = optText(l, 'lo'); if (o) L.push(`   ${o}`);
    L.push(`   ${l.qty} ຈອກ × ${kip(unitPrice(l), 'lo')} = ${kip(lineTotal(l), 'lo')}`);
    if (l.note) L.push(`   ໝາຍເຫດ: ${l.note}`);
  });
  L.push('');
  L.push(`ລວມທັງໝົດ: ${kip(cartTotal(), 'lo')}`);
  if (d.type === 'delivery') L.push('ຄ່າຈັດສົ່ງ: ກະລຸນາແຈ້ງຢືນຢັນ (ຍັງບໍ່ລວມໃນຍອດ)');
  if (d.notes) L.push(`ໝາຍເຫດ: ${d.notes}`);
  if (LANG === 'en') L.push('(ລູກຄ້າໃຊ້ພາສາອັງກິດ · Customer prefers English)');
  L.push('');
  L.push('ກະລຸນາຢືນຢັນການຮັບອໍເດີ ແລະ ເວລາ. ຂອບໃຈ');
  return L.join('\n');
}
function showPreview() {
  const d = validate(); if (!d) return;
  saveDetails(); ensureRef();
  const html = receiptHtml(d);
  $('#receipt').innerHTML = html; $('#print-area').innerHTML = html;
  const text = messageText(d);
  $('#copy-text').value = text; $('#copy-text').hidden = true;
  $('#wa').href = `${SHOP_WHATSAPP ? `https://wa.me/${SHOP_WHATSAPP}` : 'https://wa.me/'}?text=${encodeURIComponent(text)}`;
  $('#wa-note').innerHTML = `${SHOP_WHATSAPP ? t('waTo', SHOP_WHATSAPP) : t('waPick')}<br><span class="small">${t('waNote')}</span>`;
  go('preview');
}

/* ───────── Start new order (two taps) ───────── */
function armNewOrder(btn) {
  let armed = false; let timer;
  btn.addEventListener('click', () => {
    if (!state.cart.length && !state.ref) { resetAll(); return; }
    if (!armed) { armed = true; btn.textContent = t('armed'); timer = setTimeout(() => { armed = false; btn.textContent = t('newOrder'); }, 4000); return; }
    clearTimeout(timer); armed = false; resetAll(); btn.textContent = t('newOrder');
  });
}
function resetAll() {
  state = { cart: [], ref: null, created: null };
  store.del(LS); store.del(SS, sessionStorage);
  $('#details').reset(); $('#c-cc').value = '+856'; typeChanged();
  $('#c-when').value = laoInput(new Date(Date.now() + 30 * 60e3));
  $('#receipt').innerHTML = ''; $('#print-area').innerHTML = '';
  renderAll(); go('menu'); toast(t('cleared'), 'o');
}

/* ───────── Boot ───────── */
(function init() {
  const saved = store.get(LS);
  if (saved && Array.isArray(saved.cart)) state = { cart: saved.cart.filter((l) => BY_ID.has(l.pid)), ref: saved.ref || null, created: saved.created || null };
  const savedLang = store.get(LK); if (savedLang === 'en' || savedLang === 'lo') LANG = savedLang;
  if (!DELIVERY_ENABLED) $('#delivery-opt').remove();
  $('#c-when').min = laoInput(new Date(Date.now() - 10 * 60e3));
  $('#c-when').value = laoInput(new Date(Date.now() + 30 * 60e3));
  applyLang(); loadDetails(); typeChanged();
  const framed = (() => { try { return window.self !== window.top; } catch { return true; } })();
  $('#print').hidden = framed; // the print dialog only works on your own website
  $('#print').addEventListener('click', () => window.print());
  renderAll(); go('menu');

  $$('[data-lang]').forEach((b) => b.addEventListener('click', () => {
    LANG = b.dataset.lang; store.set(LK, LANG); applyLang(); renderAll();
    if (VIEW === 'preview') showPreview();
  }));
  $('#go-details').addEventListener('click', () => go('details'));
  $('#bar-next').addEventListener('click', () => go('details'));
  $$('[data-go]').forEach((b) => b.addEventListener('click', () => go(b.dataset.go)));
  $('#c-type').addEventListener('change', () => { typeChanged(); saveDetails(); });
  $('#details').addEventListener('input', saveDetails);
  $('#details').addEventListener('submit', (e) => { e.preventDefault(); showPreview(); });
  $('#copy').addEventListener('click', () => {
    const text = $('#copy-text').value;
    const fallback = () => { const ta = $('#copy-text'); ta.hidden = false; ta.focus(); ta.select(); toast(t('copyManual')); };
    try { navigator.clipboard.writeText(text).then(() => toast(t('copied'), 'o'), fallback); } catch { fallback(); }
  });
  armNewOrder($('#new-order-1')); armNewOrder($('#new-order-2'));
})();
</script>
