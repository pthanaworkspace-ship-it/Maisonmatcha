<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Maison Matcha · Matcha Club</title>
<meta name="theme-color" content="#243229">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&family=Solway:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/staff.css">
</head>
<body>
<main class="wrap" style="padding-bottom:60px">
  <div class="hero" style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap">
    <div style="flex:1"><h1>Maison Matcha Club · ສະມາຊິກ</h1><p>ຊື້ຄົບ 10 ຈອກ ຮັບຟຣີ 1 ຈອກ · ສະມັກຟຣີ</p></div>
    <button class="btn ghost" type="button" id="newM">＋ ລົງທະບຽນລູກຄ້າ</button>
    <button class="btn green" type="button" id="scanB">📷 ສະແກນ QR ສະມາຊິກ</button>
  </div>
  <div class="seg club-tabs" id="tabs" role="tablist">
    <label><input type="radio" name="tab" value="ov" checked><span>ພາບລວມ</span></label>
    <label><input type="radio" name="tab" value="mem"><span>ສະມາຊິກ</span></label>
    <label><input type="radio" name="tab" value="stamp"><span>ຈັດການສະແຕັມ</span></label>
    <label><input type="radio" name="tab" value="rew"><span>ຂອງລາງວັນ</span></label>
    <label><input type="radio" name="tab" value="rep"><span>ລາຍງານ</span></label>
    <label class="hidden" data-admin><input type="radio" name="tab" value="set"><span>ຕັ້ງຄ່າ</span></label>
    <label class="hidden" data-admin><input type="radio" name="tab" value="users"><span>ພະນັກງານ</span></label>
  </div>
  <div id="body" aria-live="polite" style="margin-top:14px"></div>
</main>
<script type="module" src="/staff-club.js"></script>
</body>
</html>
