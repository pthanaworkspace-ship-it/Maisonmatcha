<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Maison Matcha Club · ບັດສະມາຊິກ</title>
<meta name="theme-color" content="#F3EEE2">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Matcha Club">
<meta name="description" content="Your Maison Matcha Club membership card">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Pinyon+Script&family=Noto+Sans+Lao:wght@400;500;600;700&family=Solway:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/member.css">
</head>
<body class="member-page">
<main class="mp">
  <header class="mp-head">
    <div class="mp-eyebrow">MAISON MATCHA CLUB</div>
    <h1>ບັດສະມາຊິກຂອງທ່ານ <span class="en">Your member card</span></h1>
  </header>
  <section class="kc is-loading" id="kc" aria-label="Matcha Club member card">
    <div class="kc-space" id="kcSpace"></div>
    <div class="kc-pocket">
      <div class="kc-skel" aria-hidden="true"></div>
      <div class="kc-holder" aria-hidden="true">
        <img class="kc-hlogo" src="/logo.webp" alt="">
        <p class="kc-script">Matcha<span>Club</span></p>
        <div class="kc-ritual">DAILY RITUAL</div>
        <div class="kc-ritual-lo">ຊື້ຄົບ 10 ຈອກ ຮັບຟຣີ 1 ຈອກ</div>
        <div class="kc-ritual-en">BUY 10 · GET 1 FREE</div>
        <div class="kc-hfoot">FROM KYOTO TO LUANG PRABANG</div>
      </div>
    </div>
    <div class="kc-actions"><button class="kc-btn" id="kcBtn" type="button" disabled aria-expanded="false" aria-controls="kcCard">ກຳລັງໂຫຼດ… <span class="en">Loading…</span></button></div>
  </section>
  <div id="extra" aria-live="polite"></div>
</main>
<script type="module" src="/member.js"></script>
</body>
</html>
