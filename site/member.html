<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Maison Matcha · Matcha Club</title>
<meta name="theme-color" content="#F3EEE2">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="description" content="Your Maison Matcha member card">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Pinyon+Script&family=Noto+Sans+Lao:wght@400;500;600;700&family=Solway:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/member.css">
</head>
<body class="member-page">
<main class="mp">
  <header class="mp-head">
    <div class="mp-eyebrow">MAISON MATCHA · MATCHA CLUB</div>
    <h1>ບັດສະມາຊິກຂອງທ່ານ <span class="en">Your member card</span></h1>
  </header>
  <section class="kc is-loading" id="kc" aria-label="Matcha Club member card">
    <div class="kc-space" id="kcSpace"></div>
    <div class="kc-pocket">
      <div class="kc-skel" aria-hidden="true"></div>
      <div class="kc-holder" aria-hidden="true">
        <img class="kc-hlogo" src="/logo.webp" alt="">
        <p class="kc-script">Matcha<span>Club</span></p>
        <div class="kc-ritual">DAILY RITUAL</div>
        <div class="kc-ritual-lo">ພິທີມັດຊະປະຈຳວັນ</div>
        <svg class="kc-bowl" viewBox="0 0 160 84" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <!-- chasen (whisk): handle with fanned bamboo tines -->
          <path d="M117.5 6h5v26h-5z"/>
          <path d="M114 32h12"/>
          <path d="M114 32c-6 6-8 16-6 24 2 6 7 9 12 9s10-3 12-9c2-8 0-18-6-24"/>
          <path d="M117 33c-3 8-3 20 0 31M120 33v32M123 33c3 8 3 20 0 31M115 35c-4 7-5 16-3 24M125 35c4 7 5 16 3 24" opacity=".55"/>
          <!-- chawan (bowl) -->
          <path d="M14 46h82c0 16-14 28-41 28S14 62 14 46z"/>
          <path d="M14 46c6-3 24-5 41-5s35 2 41 5"/>
          <path d="M41 74h28l-3 6H44z"/>
          <path d="M26 54c8 6 20 9 29 9" opacity=".55"/>
          <path d="M40 38c4-6 2-10-1-14M54 36c4-7 2-12-2-16M68 38c3-5 2-9-1-12" opacity=".5"/>
        </svg>
        <div class="kc-hfoot">FROM KYOTO TO LUANG PRABANG</div>
      </div>
    </div>
    <div class="kc-actions"><button class="kc-btn" id="kcBtn" type="button" disabled aria-expanded="false" aria-controls="kcCard">ກຳລັງໂຫຼດ… <span class="en">Loading…</span></button></div>
  </section>
  <div id="extra" aria-live="polite"></div>
</main>
<script type="module" src="/member.js"></script>
</body>
</html>
