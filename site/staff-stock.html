<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Maison Matcha · ເບີກສິນຄ້າເຂົ້າບາ</title>
<meta name="theme-color" content="#243229">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&family=Solway:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/staff.css">
<style>
.st-wrap{max-width:640px}
.st-day{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.st-day label.field{margin:0;flex:1;min-width:160px}
.st-group h3{font-size:.95rem;margin:18px 0 6px;color:var(--muted);font-weight:500}
.st-group h3:first-child{margin-top:4px}
.st-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line-soft)}
.st-row .nm{flex:1;min-width:0;font-size:.95rem;line-height:1.35}
.st-row .q{display:flex;align-items:center;gap:6px;flex:none}
.st-row input{width:110px;text-align:right;font-variant-numeric:tabular-nums;font-size:1.1rem}
.st-row .u{width:30px;font-size:.82rem;color:var(--muted)}
.st-row.on .nm{font-weight:600;color:var(--green-deep)}
.st-count{font-size:.9rem;color:var(--muted);margin:8px 0 0}
.st-log{list-style:none;padding:0;margin:0}
.st-log li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line-soft)}
.st-log li:first-child{border-top:0}
.st-log .t{flex:1;min-width:0}
.st-log .who{font-size:.8rem;color:var(--muted)}
.st-log .amt{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.st-log li.void .t,.st-log li.void .amt{text-decoration:line-through;opacity:.55}
.st-log .x{border:1px solid var(--line-soft);background:none;border-radius:999px;padding:4px 12px;font:inherit;font-size:.8rem;cursor:pointer;color:var(--red);min-height:34px}
.st-week{list-style:none;padding:0;margin:0}
.st-week li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line-soft)}
.st-week li:first-child{border-top:0}
.st-week button{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;flex:1;min-height:36px}
.st-week .who{font-size:.8rem;color:var(--muted)}
.sticky-save{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg, #f6f3ea) 70%,transparent);padding:14px 0 10px;margin-top:6px}
</style>
</head>
<body>
<main class="wrap st-wrap" style="padding-bottom:60px">
  <div class="hero"><h1>ເບີກສິນຄ້າເຂົ້າບາ</h1><p>ບັນທຶກທຸກຄັ້ງທີ່ເອົາສິນຄ້າຈາກສາງໃຫຍ່ໄປໃຊ້ຢູ່ບາ <span class="en">· Storage → bar log</span></p></div>
  <div id="body" aria-live="polite"><div class="panel muted">ກຳລັງໂຫຼດ…</div></div>
</main>
<script type="module" src="/staff-stock.js"></script>
</body>
</html>
